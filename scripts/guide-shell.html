<!doctype html>
<html lang="zh-CN">
<head>
<!--
  guide-shell.html | 离线单文件教程外壳（project-docs-workflow guide）
  ==================================================================

  INJECTION CONTRACT（构建时由零依赖 Node 生成器替换）

  四种占位标记，均以双花括号书写。为免本注释自身被替换，下文中花括号
  之间加了空格；生成器里请写成连续的 双花括号 + 大写名称 + 双花括号。

    1) 标题占位      { {TITLE} }
       纯文本。用于 <title> 与页面 h1。
       生成器应从正文剥离源 Markdown 的一级标题，由外壳渲染 h1，避免重复。

    2) 目录占位      { {TOC} }
       以一条 HTML 注释的形式独占一行（注释分隔符 + 占位）。
       整行替换为 <ul>…</ul>，由正文 h2 生成，每项形如：
         <ul><li><a href="#slug">1. 一分钟定位</a></li>…</ul>
       每个 href 必须指向正文中对应 h2 的 id（同一 slug）。
       保留 <ul> 作为根节点；嵌套 <ul> 可选，外壳已适配。
       nav 外壳、details 折叠结构与“目录”标题由本文件提供。

    3) 正文占位      { {CONTENT} }
       以一条 HTML 注释的形式独占一行（注释分隔符 + 占位）。
       整行替换为渲染后的正文（h2 / h3 / p / table / ul / ol / pre / figure）。
       正文每个 h2 需要唯一的 id（TOC 高亮与锚点跳转依赖它）。
       正文不要包含 h1，也不要再包 <main> 或 <article>。

    4) 版本占位      { {VERSION} }
       如 v5.12。仅出现在页脚，最终文本为：
         project-docs-workflow v5.12 · 生成自 guide/README.md

  其它约定
  - 输出必须字节稳定：本文件不含时间戳、随机值或构建环境信息。
  - 全部样式与脚本内联：无外部字体、外部样式表、外链脚本或远程资源。
  - 生成器可原样插入包含 <figure class="fig"> 的 HTML；外壳只负责样式。

  设计要点
  - 断点：1024px（桌面侧栏 / 移动折叠目录）、719px（字号与内边距）、
    639px（表格改为横向滚动）。
  - 浅色 + 深色由 prefers-color-scheme 切换，打印另有独立样式。
  - 目录高亮：IntersectionObserver 触发，按标题与视口顶部参考线的位置计算。
-->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="description" content="project-docs-workflow 使用教程：10 分钟了解文档分层、五步流程与 init 实操。">
<title>{{TITLE}}</title>
<style>
/* ============================================================
   Tokens
   ============================================================ */
:root {
  --sans: -apple-system, "Segoe UI", "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Courier New", monospace;

  --bg: #faf8f4;
  --surface: #ffffff;
  --surface-sunk: #f4f0e8;
  --fg: #201e1a;
  --fg-soft: #3b3833;
  --muted: #6d685e;
  --faint: #9a948a;
  --border: #e3ddd1;
  --border-soft: #ece7dc;
  --accent: #9c3f26;
  --accent-soft: #c86a4c;
  --focus: #9c3f26;

  --code-bg: #f1ece1;
  --code-border: #e6dfd1;
  --th-bg: #f2ede3;
  --mark: #f4e3c8;

  --fig-bg: #f6f2e9;
  --fig-box: #ece5d7;
  --fig-border: #d6cdbb;

  --measure: 70ch;
  --radius: 10px;
  --pad: 32px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131311;
    --surface: #1b1a18;
    --surface-sunk: #201f1c;
    --fg: #e9e4da;
    --fg-soft: #cfc9be;
    --muted: #a39c90;
    --faint: #757066;
    --border: #302d28;
    --border-soft: #272420;
    --accent: #e08a6d;
    --accent-soft: #b96a50;
    --focus: #f0a184;

    --code-bg: #201e1b;
    --code-border: #2c2925;
    --th-bg: #23211d;
    --mark: #4a3a22;

    --fig-bg: #1b1a17;
    --fig-box: #2a2723;
    --fig-border: #443e37;
  }
}

/* ============================================================
   Base
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; }

html {
  background: var(--bg);
  color-scheme: light dark;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.78;
  font-kerning: normal;
  font-feature-settings: "kern" 1;
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-wrap: break-word;
}

::selection { background: var(--mark); color: var(--fg); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
  border-radius: 3px;
}

/* Skip-link target: the jump itself is the feedback; a page-wide ring is noise. */
#main:focus,
#main:focus-visible { outline: 0; }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* Skip link */
.skip-link {
  position: absolute;
  top: 10px;
  left: 12px;
  z-index: 200;
  padding: 10px 16px;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 10px 30px -12px rgba(0, 0, 0, .35);
  transform: translateY(-160%);
  transition: transform .16s ease;
}
.skip-link:focus-visible { transform: translateY(0); }

/* ============================================================
   Shell layout
   ============================================================ */
.shell {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--pad);
}

.column {
  min-width: 0;
}

.page-head,
.article,
.page-foot {
  max-width: var(--measure);
  margin-left: auto;
  margin-right: auto;
}

/* --- Page header --- */
.page-head {
  padding: 76px 0 8px;
}

.eyebrow {
  margin: 0 0 18px;
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--faint);
}
.eyebrow .sep { color: var(--border); padding: 0 .4em; }

.page-title {
  margin: 0;
  font-size: clamp(1.85rem, 4.3vw, 2.4rem);
  line-height: 1.24;
  font-weight: 700;
  letter-spacing: -0.005em;
  color: var(--fg);
}

.page-meta {
  margin: 18px 0 0;
  font-size: 13.5px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 10px;
}
.page-meta::before {
  content: "";
  display: block;
  width: 26px;
  height: 2px;
  background: var(--accent);
  flex: none;
}

/* ============================================================
   Sidebar / TOC
   ============================================================ */
.sidebar {
  position: sticky;
  top: 0;
  align-self: start;
  z-index: 40;
}

.toc-title {
  margin: 0 0 16px;
  padding-left: 1px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--faint);
}

.toc-details { margin: 0; }
.toc-summary { display: none; }

.toc ul,
.toc ol {
  list-style: none;
  margin: 0;
  padding: 0;
  border-left: 1px solid var(--border);
}
.toc li { margin: 0; }

.toc li a {
  display: block;
  padding: 7px 10px 7px 15px;
  margin-left: -1px;
  border-left: 2px solid transparent;
  color: var(--muted);
  font-size: 13.5px;
  line-height: 1.5;
  text-decoration: none;
  transition: color .16s ease, border-color .16s ease;
}
.toc li a:hover { color: var(--fg); background: transparent; }
.toc li a.is-active {
  color: var(--fg);
  border-left-color: var(--accent);
  font-weight: 600;
}
.toc li a.is-active:hover { text-decoration: none; }

/* Nested lists (optional) */
.toc ul ul,
.toc ul ol,
.toc ol ul,
.toc ol ol { margin: 2px 0 6px; border-left-color: var(--border-soft); }
.toc ul ul a,
.toc ul ol a,
.toc ol ul a,
.toc ol ol a { font-size: 12.5px; padding-top: 5px; padding-bottom: 5px; }

/* ============================================================
   Article
   ============================================================ */
.article {
  padding: 40px 0 0;
  font-size: 1.0625rem;
  line-height: 1.78;
  color: var(--fg-soft);
}

.article > :not(.fig) { max-width: 100%; }

.article p {
  margin: 0 0 1.08em;
}

.article > p:first-of-type {
  font-size: 1.12em;
  line-height: 1.72;
  color: var(--fg);
  margin-bottom: 1.4em;
}

.article strong { font-weight: 650; color: var(--fg); }
.article em { font-style: italic; }

/* Headings */
.article h2,
.article h3,
.article h4 {
  color: var(--fg);
  font-weight: 650;
  line-height: 1.4;
  scroll-margin-top: 24px;
}

.article h2 {
  position: relative;
  margin: 4.5em 0 1.1em;
  padding-top: 1.35em;
  font-size: 1.5rem;
  letter-spacing: .002em;
  border-top: 1px solid var(--border);
}
.article h2::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 0;
  width: 30px;
  height: 2px;
  background: var(--accent);
}
.article h2:first-child { margin-top: 1.6em; }

.article h3 {
  margin: 2.4em 0 .7em;
  font-size: 1.09rem;
  font-weight: 650;
  letter-spacing: .01em;
}

.article h4 {
  margin: 2em 0 .5em;
  font-size: 1rem;
  color: var(--fg-soft);
}

.article h2 + p,
.article h3 + p,
.article h2 + ul,
.article h3 + ul,
.article h2 + ol,
.article h3 + ol { margin-top: 0; }

/* Lists */
.article ul,
.article ol {
  margin: 0 0 1.15em;
  padding-left: 1.45em;
}
.article li { margin: .32em 0; padding-left: .15em; }
.article li::marker { color: var(--faint); }
.article ol > li::marker {
  font-variant-numeric: tabular-nums;
  font-size: .92em;
  color: var(--muted);
}
.article li > ul,
.article li > ol { margin: .35em 0 .45em; }
.article li > p { margin-bottom: .5em; }

/* Inline code */
.article code,
.article kbd,
.article samp {
  font-family: var(--mono);
  font-size: .86em;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: 5px;
  padding: .1em .34em;
  color: var(--fg);
  white-space: break-spaces;
}

/* Code blocks */
.article pre {
  margin: 1.6em 0;
  padding: 1.05em 1.2em;
  background: var(--code-bg);
  border: 1px solid var(--code-border);
  border-radius: var(--radius);
  overflow-x: auto;
  font-size: 13.5px;
  line-height: 1.72;
  tab-size: 2;
  color: var(--fg);
}
.article pre code {
  display: block;
  background: none;
  border: 0;
  padding: 0;
  font-size: inherit;
  color: inherit;
  white-space: pre;
}

/* Blockquote (not used by current guide, styled for safety) */
.article blockquote {
  margin: 1.6em 0;
  padding: .2em 0 .2em 1.15em;
  border-left: 2px solid var(--accent-soft);
  color: var(--muted);
}

/* Tables — real table layout at comfortable widths; below 640px the table
   itself becomes the horizontal scroll container (no wrapper needed). */
.article table {
  display: table;
  width: 100%;
  max-width: 100%;
  margin: 1.5em 0;
  border-collapse: collapse;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  font-size: .93em;
  line-height: 1.62;
  color: var(--fg-soft);
}
.article thead th {
  background: var(--th-bg);
  color: var(--fg);
  font-weight: 600;
  text-align: left;
  white-space: nowrap;
}
.article th,
.article td {
  padding: .62em .85em;
  border-bottom: 1px solid var(--border-soft);
  text-align: left;
  vertical-align: top;
}
.article th:first-child,
.article td:first-child { padding-left: .7em; }
.article th:last-child,
.article td:last-child { padding-right: .7em; }
.article tbody tr:last-child th,
.article tbody tr:last-child td { border-bottom: 0; }
.article tbody { background: transparent; }

/* Keep reference tables calm: inline code reads as a tint, not a chip. */
.article th code,
.article td code {
  background: var(--surface-sunk);
  border-color: transparent;
  padding: .04em .3em;
}

/* Figures */
.article .fig {
  position: relative;
  width: min(720px, calc(100% + 2rem));
  margin: 2.4em 0 2.1em;
  margin-left: 50%;
  transform: translateX(-50%);
  padding: 1.1rem 1.1rem .95rem;
  background: var(--fig-bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius);
  overflow-x: auto;
  overflow-y: hidden;
}
.article .fig svg {
  width: 100%;
  min-width: 650px;
  height: auto;
  display: block;
}
.article .fig .box {
  fill: var(--fig-box);
  stroke: var(--fig-border);
  stroke-width: 1;
}
.article .fig .label {
  fill: var(--fg);
  font-size: 16px;
}
.article .fig .muted {
  fill: var(--muted);
  font-size: 12.5px;
}
.article .fig .edge {
  stroke: var(--muted);
  stroke-width: 1.5;
  fill: none;
}
.article .fig .dashed { stroke-dasharray: 5 4; }
.article .fig .arrowhead { fill: var(--muted); }
.article .fig text { font-family: inherit; }

.article .fig figcaption {
  position: sticky;
  left: 0;
  width: 100%;
  margin-top: .85rem;
  font-size: 13px;
  line-height: 1.65;
  color: var(--muted);
}

/* Safety for any stray media */
.article img,
.article video { max-width: 100%; height: auto; }

.article hr {
  border: 0;
  border-top: 1px solid var(--border);
  margin: 3em 0;
}

/* ============================================================
   Footer
   ============================================================ */
.page-foot {
  margin-top: 5rem;
  padding: 2rem 0 4.5rem;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--muted);
}
.page-foot p { margin: 0; }
.page-foot .ver {
  font-family: var(--mono);
  font-size: .95em;
  color: var(--fg-soft);
}

/* ============================================================
   Mobile: TOC becomes sticky collapsible header (<1024px)
   ============================================================ */
@media screen and (max-width: 1023px) {
  :root { --pad: 24px; }

  .sidebar {
    position: sticky;
    top: 0;
    z-index: 40;
    margin: 0 calc(-1 * var(--pad));
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }

  .toc-title { display: none; }

  .toc-details { position: relative; }

  .toc-summary {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 52px;
    padding: 0 var(--pad);
    cursor: pointer;
    list-style: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .toc-summary::-webkit-details-marker { display: none; }
  .toc-summary:focus-visible { outline-offset: -3px; border-radius: 0; }

  .toc-summary .label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    flex: none;
  }

  .toc-current {
    flex: 1 1 auto;
    min-width: 0;
    text-align: right;
    font-size: 12.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chev {
    flex: none;
    width: 7px;
    height: 7px;
    margin-right: 2px;
    border-right: 1.5px solid var(--muted);
    border-bottom: 1.5px solid var(--muted);
    transform: rotate(45deg) translate(-1px, -1px);
    transition: transform .18s ease;
  }
  .toc-details[open] .chev { transform: rotate(-135deg) translate(-1px, -1px); }

  .toc-body {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    max-height: 68vh;
    overflow-y: auto;
    padding: 10px var(--pad) 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 24px 40px -28px rgba(0, 0, 0, .45);
    overscroll-behavior: contain;
  }

  /* Avoid a flash of the open panel before the script runs (progressive
     enhancement only; without JS the panel simply stays expanded). */
  html.js .toc-details:not([data-ready]) .toc-body { display: none; }

  /* No-JS fallback: an expanded list that pushes content instead of an
     overlay, so the page stays readable. */
  html:not(.js) .toc-body {
    position: static;
    max-height: none;
    box-shadow: none;
    border-bottom: 0;
  }

  .toc ul,
  .toc ol { border-left: 0; }
  .toc li a {
    padding: 11px 0 11px 14px;
    font-size: 15px;
    border-left-width: 2px;
  }
  .toc li a.is-active { background: var(--surface-sunk); }

  .page-head { padding-top: 44px; }
  .article { padding-top: 34px; }
  .article h2 { scroll-margin-top: 76px; font-size: 1.34rem; margin-top: 3.6em; }
  .article h3 { scroll-margin-top: 76px; }
  .article .fig {
    width: calc(100% + 1rem);
    padding: .8rem .8rem .7rem;
  }
  .article .fig figcaption { font-size: 12.5px; }
  .page-foot { margin-top: 3.5rem; }
}

@media screen and (max-width: 719px) {
  :root { --pad: 20px; }
  body { font-size: 16.5px; }
  .page-head { padding-top: 34px; }
  .page-title { font-size: 1.85rem; }
  .eyebrow { margin-bottom: 14px; }
  .page-meta { margin-top: 14px; font-size: 13px; }
  .article { font-size: 1rem; }
  .article > p:first-of-type { font-size: 1.06em; }
  .article h2 { font-size: 1.24rem; }
  .article pre { font-size: 12.5px; padding: .95em 1em; }
  .article .fig { margin-top: 2em; }
  /* Figures are wider than the phone column and scroll horizontally. */
  .article .fig figcaption::after {
    content: "（图形可左右滑动）";
    color: var(--faint);
  }
}

/* Narrow phones: tables scroll inside their own box. Cell min-width keeps
   columns readable instead of letting every column collapse into 3–4
   characters per line; the table box itself is the scroll container. */
@media screen and (max-width: 639px) {
  .article table {
    display: block;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .article th,
  .article td { min-width: 7em; }
}

/* Desktop grid */
@media screen and (min-width: 1024px) {
  .shell {
    display: grid;
    grid-template-columns: 240px minmax(0, 1fr);
    column-gap: 8px;
  }
  .sidebar {
    padding: 88px 30px 48px 0;
    max-height: 100vh;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .column { display: flex; flex-direction: column; }
  .page-head { width: 100%; padding-top: 84px; }
  .article { width: 100%; }
  .page-foot { width: 100%; }
  .toc-details > .toc-body { display: block; }
}

/* Wide screens: keep the reading column optically centered */
@media screen and (min-width: 1200px) {
  :root { --pad: 40px; }
}

/* ============================================================
   Motion preferences
   ============================================================ */
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
  }
}

/* ============================================================
   Print
   ============================================================ */
@media print {
  @page { margin: 18mm 16mm; }

  :root {
    --bg: #fff;
    --surface: #fff;
    --fg: #000;
    --fg-soft: #111;
    --muted: #333;
    --faint: #444;
    --border: #c8c8c8;
    --border-soft: #ddd;
    --accent: #000;
    --th-bg: #f0f0f0;
    --fig-bg: #fff;
    --fig-box: #f4f4f4;
    --fig-border: #bbb;
    --code-bg: #f5f5f5;
    --code-border: #ddd;
  }

  html, body {
    background: #fff !important;
    color: #000;
    font-size: 10.5pt;
    line-height: 1.65;
  }

  .skip-link,
  .sidebar,
  .toc,
  .toc-details { display: none !important; }

  .shell {
    display: block;
    max-width: none;
    padding: 0;
  }
  .column { display: block; }

  .page-head,
  .article,
  .page-foot {
    max-width: none;
    width: auto;
    margin: 0;
  }
  .page-head { padding: 0 0 6pt; }
  .page-title { font-size: 22pt; }
  .page-meta { margin-top: 8pt; }
  .eyebrow { margin-bottom: 8pt; color: #444; }

  .article { padding-top: 18pt; color: #111; }
  .article p { orphans: 3; widows: 3; }

  .article h2,
  .article h3,
  .article h4 {
    break-after: avoid-page;
    page-break-after: avoid;
    color: #000;
  }
  .article h2 {
    margin-top: 22pt;
    font-size: 15pt;
    border-top-color: #bbb;
  }
  .article h2::before { background: #000; }
  .article h3 { font-size: 11.5pt; }

  .article a {
    color: #000;
    text-decoration: none;
  }
  /* 仅外链打印 URL；本页链接全部为内部锚点，不输出。 */
  .article a[href^="http"]::after {
    content: " (" attr(href) ")";
    font-size: 9pt;
    color: #444;
    word-break: break-all;
  }

  .article .fig {
    width: 100% !important;
    margin: 14pt 0 !important;
    margin-left: 0 !important;
    transform: none !important;
    overflow: visible !important;
    background: #fff;
    border: 1px solid #ccc;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .article .fig svg { min-width: 0 !important; width: 100% !important; }
  .article .fig figcaption { position: static; color: #333; }

  .article table {
    display: table;
    width: 100%;
    overflow: visible;
    font-size: 9pt;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .article thead th { background: #eee !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .article tr,
  .article td,
  .article th { break-inside: avoid; page-break-inside: avoid; }

  .article pre {
    background: #f6f6f6;
    border: 1px solid #ddd;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 9pt;
    break-inside: avoid;
    page-break-inside: avoid;
  }
  .article pre code { white-space: pre-wrap; }
  .article code { background: #f2f2f2; border-color: #ddd; }

  .article blockquote { border-left-color: #999; color: #333; }

  .page-foot {
    margin-top: 24pt;
    padding: 10pt 0 0;
    border-top-color: #bbb;
    color: #333;
  }
}
</style>
<script>document.documentElement.classList.add('js');</script>
</head>
<body>

<a class="skip-link" href="#main">跳到正文</a>

<div class="shell">
  <aside class="sidebar">
    <nav class="toc" aria-label="目录">
      <p class="toc-title">目录</p>
      <details class="toc-details" open>
        <summary class="toc-summary">
          <span class="label">目录</span>
          <span class="toc-current" data-toc-current></span>
          <span class="chev" aria-hidden="true"></span>
        </summary>
        <div class="toc-body">
          <!--{{TOC}}-->
        </div>
      </details>
    </nav>
  </aside>

  <div class="column">
    <header class="page-head">
      <p class="eyebrow">Guide<span class="sep">/</span>中文</p>
      <h1 class="page-title">{{TITLE}}</h1>
      <p class="page-meta">6 节 · 约 10 分钟</p>
    </header>

    <main id="main" tabindex="-1">
      <article class="article">
        <!--{{CONTENT}}-->
      </article>
    </main>

    <footer class="page-foot">
      <p>project-docs-workflow <span class="ver">{{VERSION}}</span> · 生成自 guide/README.md</p>
    </footer>
  </div>
</div>

<script>
(function () {
  "use strict";

  var desktop = window.matchMedia("(min-width: 1024px)");
  var details = document.querySelector(".toc-details");
  var currentLabel = document.querySelector("[data-toc-current]");
  var links = Array.prototype.slice.call(document.querySelectorAll('.toc a[href^="#"]'));

  /* ---- Mobile collapsible TOC ------------------------------------- */
  function syncPanelLayout() {
    if (!details) return;
    details.open = desktop.matches;
    if (!details.hasAttribute("data-ready")) {
      details.setAttribute("data-ready", "");
    }
  }
  syncPanelLayout();
  if (desktop.addEventListener) {
    desktop.addEventListener("change", syncPanelLayout);
  } else if (desktop.addListener) {
    desktop.addListener(syncPanelLayout);
  }

  /* ---- Current section via IntersectionObserver ------------------- */
  var headings = Array.prototype.slice
    .call(document.querySelectorAll(".article h2[id]"))
    .filter(function (h) { return h.id; });

  if (!headings.length) {
    // Fall back to whatever the TOC points at.
    links.forEach(function (a) {
      var el = document.getElementById(decodeURIComponent(a.getAttribute("href").slice(1)));
      if (el && headings.indexOf(el) === -1) headings.push(el);
    });
  }

  var byId = {};
  links.forEach(function (a) {
    var id = decodeURIComponent(a.getAttribute("href").slice(1));
    (byId[id] || (byId[id] = [])).push(a);
  });

  var activeId = null;

  function setActive(id) {
    if (!id || id === activeId) return;
    activeId = id;

    links.forEach(function (a) {
      var on = decodeURIComponent(a.getAttribute("href").slice(1)) === id;
      a.classList.toggle("is-active", on);
      if (on) a.setAttribute("aria-current", "true");
      else a.removeAttribute("aria-current");
    });

    if (currentLabel) {
      var first = byId[id] && byId[id][0];
      currentLabel.textContent = first ? first.textContent.trim() : "";
    }
  }

  // 标题顶部越过参考线（含移动端吸顶栏）即视为当前小节。
  function pickCurrent() {
    if (!headings.length) return;
    var line = desktop.matches ? 32 : 76;
    var found = headings[0].id;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top - line <= 1) {
        found = headings[i].id;
      } else {
        break;
      }
    }
    if (window.innerHeight + window.pageYOffset >= document.documentElement.scrollHeight - 4) {
      found = headings[headings.length - 1].id;
    }
    setActive(found);
  }

  var ticking = false;
  function schedule() {
    if (ticking) return;
    ticking = true;
    window.requestAnimationFrame(function () {
      ticking = false;
      pickCurrent();
    });
  }

  if (window.IntersectionObserver && headings.length) {
    var io = new IntersectionObserver(schedule, {
      root: null,
      rootMargin: "-76px 0px -68% 0px",
      threshold: [0, 1]
    });
    headings.forEach(function (h) { io.observe(h); });
    window.addEventListener("scroll", schedule, { passive: true });
    window.addEventListener("resize", schedule);
  }

  /* ---- Link interactions ------------------------------------------ */
  links.forEach(function (a) {
    a.addEventListener("click", function () {
      var id = decodeURIComponent(a.getAttribute("href").slice(1));
      setActive(id);
      if (!desktop.matches && details) details.open = false;
    });
  });

  // Esc closes the mobile TOC panel and returns focus to its summary.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && details && details.open && !desktop.matches) {
      details.open = false;
      var summary = details.querySelector("summary");
      if (summary) summary.focus();
    }
  });

  /* ---- Initial state ---------------------------------------------- */
  window.addEventListener("load", function () {
    // 等布局与字体稳定后再定位一次
    window.requestAnimationFrame(pickCurrent);
    if (window.location.hash) {
      var id = decodeURIComponent(window.location.hash.slice(1));
      if (id) setActive(id);
    }
  });
  window.requestAnimationFrame(pickCurrent);
})();
</script>
</body>
</html>
