# 掌握度 profile。复制到 docs/teach/<user>/profile.yml。
# 一个用户在一个仓库上的机器可读状态。每个概念都需要锚点和证据。
# 给每条记录标注 verified / inferred。绝不要存判定（「已掌握」）；存观察。

version: 1
user: <slug>                   # `git config user.name` 的 slug，回退值：default
repo: <name>
repo_commit: <sha>             # 上次会话时的 `git rev-parse --short HEAD`
focus: <用户会先改什么>
density: normal                # low | normal | high —— 只影响节奏；绝不改变 brief 的深度
mode: tutor                    # tour | tutor | drill
updated: <YYYY-MM-DD>

prior:                         # 在第一份 brief 之前测量一次；未知是一个值，不是零
  assessed: null               # YYYY-MM-DD | null
  method: none                 # baseline teach-back | 自报 | none
  transcript: []               # 原样记录，每个回答一条
  effect: null                 # 「跳过 00-model.md：回路已经正确」/「00 从接缝纠正开始」

curriculum:                    # 四份 brief，从粗到细
  model:      { status: todo, path: 00-model.md }      # todo | active | done
  map:        { status: todo, path: 01-map.md }
  structure:  { status: todo, path: 02-structure.md }
  operations: { status: todo, path: 03-operations.md }
  runbook:    { status: todo, path: runbook.md }

concepts:
  - id: <stable-id>
    canonical: <name>
    aliases: []
    anchor: <brief 章节或 path:line>
    source: taught            # taught | prior —— 受教之前测量到的先前知识同样算证据
    level: L0                 # L0 unknown | L1 locate | L2 explain | L3 predict | L4 apply
    confidence: 0.0           # 用户自评 0-1
    accuracy: 0.0             # 实测 0-1
    evidence: []              # 引用回答或错误，并带日期
    misconceptions: []
    next_review: null         # YYYY-MM-DD
    verified: <verified|inferred>

pending_explanations: []      # 会话中途发现的待办解释，每行一条
open_questions: []            # 用户提出但尚未回答的问题
last_session: null            # YYYY-MM-DD
